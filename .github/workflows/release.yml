name: GA Release

on:
  workflow_dispatch:
    inputs:
      rc_tag:
        description: "RC tag to promote (e.g. rc-20240611-120000-abc1234)"
        required: true
        type: string
      version:
        description: "Release version (e.g. 1.0.0)"
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.rc_tag }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Update version
        run: |
          sed -i "s/versionName = \".*\"/versionName = \"${{ inputs.version }}\"/" app/build.gradle.kts

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Sign APK (debug keystore fallback)
        if: ${{ !secrets.ANDROID_KEYSTORE }}
        run: cp app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/tvstreamnode-${{ inputs.version }}.apk

      - name: Sign APK (release keystore)
        if: ${{ secrets.ANDROID_KEYSTORE }}
        uses: ilharp/sign-android-release@v1
        with:
          releaseDir: app/build/outputs/apk/release
          signingKey: ${{ secrets.ANDROID_KEYSTORE }}
          keyAlias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: TvStreamNode v${{ inputs.version }}
          body: |
            ## TvStreamNode v${{ inputs.version }}

            GA release promoted from ${{ inputs.rc_tag }}.

            ### Changes
            See the commit log for details.
          files: app/build/outputs/apk/release/*.apk
          draft: false
          prerelease: false
